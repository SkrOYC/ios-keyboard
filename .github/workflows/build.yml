name: Build and probe iOS lifecycle

on:
  push:
    branches: [master, "feat/**", "fix/**", "chore/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: zsh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bootstrap devenv and direnv
        run: |
          set -euo pipefail
          nixpkgs_ref=$(nix eval --raw --impure --expr 'let input = (builtins.fromJSON (builtins.readFile ./devenv.lock)).nodes.nixpkgs.locked; in "github:${input.owner}/${input.repo}/${input.rev}"')
          nix profile add "${nixpkgs_ref}#devenv" "${nixpkgs_ref}#direnv"
          direnv allow

      - name: Check source and tooling
        run: direnv exec . check

      - name: Install, enable, and exercise the keyboard in the simulator
        run: direnv exec . ios-test

      - name: Archive and verify the unsigned device IPA
        run: direnv exec . ios-build

      - name: Upload logs and simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-evidence
          path: |
            build/*.log
            build/*.xcresult
            build/*.png
            build/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KeyboardHost-ipa
          path: |
            build/KeyboardHost.ipa
            build/KeyboardHost.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish a phone download
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          direnv exec . gh release create "$GITHUB_REF_NAME" \
            build/KeyboardHost.ipa build/KeyboardHost.ipa.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
