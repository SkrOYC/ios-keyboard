name: Build unsigned IPA

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          if ! xcodebuild archive \
            -project KeyboardHost.xcodeproj \
            -scheme KeyboardHost \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KeyboardHost.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" || true
            tail -n 80 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi
          grep -E 'warning:|\*\* ARCHIVE' "$RUNNER_TEMP/xcodebuild.log" || true
          test -d "$RUNNER_TEMP/KeyboardHost.xcarchive/Products/Applications/KeyboardHost.app"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KeyboardHost.xcarchive/Products/Applications/KeyboardHost.app"
          test -d "$APP/PlugIns/Keyboard.appex" || { echo "::error::Keyboard.appex missing from PlugIns"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../KeyboardHost.ipa Payload)
          unzip -l KeyboardHost.ipa | grep -E 'Info.plist$|Keyboard.appex/Keyboard$|KeyboardHost.app/KeyboardHost$'
          ls -lh KeyboardHost.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardHost-ipa
          path: KeyboardHost.ipa
          if-no-files-found: error

  release:
    # Push a tag like v0.2.0 to get a Release with KeyboardHost.ipa attached,
    # downloadable straight from Safari on the iPhone.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyboardHost-ipa
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" KeyboardHost.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
